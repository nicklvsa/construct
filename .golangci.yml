run:
  timeout: 3m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - misspell
    - revive
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/nicklvsa/construct
  gofmt:
    simplify: true
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-naming
      - name: error-strings
      - name: error-return
      - name: errorf
      - name: exported
        disabled: true # keep noisy exported-comment checks off for this project
      - name: increment-decrement
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: var-declaration
      - name: var-naming

issues:
  exclude-rules:
    # Path-by-path test files legitimately have unused params in stubs.
    - path: _test\.go
      linters:
        - revive
  max-issues-per-linter: 0
  max-same-issues: 0
